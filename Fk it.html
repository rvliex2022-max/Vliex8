function toggleLanguage() {
  if (currentLang === 'en') {
    currentLang = 'ar';
    document.documentElement.lang = 'ar';
    document.documentElement.dir = 'rtl';
    document.getElementById('langToggleBtn').textContent = 'English';
  } else {
    currentLang = 'en';
    document.documentElement.lang = 'en';
    document.documentElement.dir = 'ltr';
    document.getElementById('langToggleBtn').textContent = 'العربية';
  }
  updateStaticTexts();
}

  const t = i18n[currentLang];

  if(document.getElementById('roomInput')) document.getElementById('roomInput').placeholder = t.roomPlaceholder;
  if(document.getElementById('btnCreate')) document.getElementById('btnCreate').textContent = t.btnCreate;

function shuffle(arr){let a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let questions=[];
const QUESTIONS_PER_GAME=20;
const TIME_PER_QUESTION=18;
let playerName="",room="",score=0,oppScore=0,idx=0,timer=null,time=TIME_PER_QUESTION;
let peer=null,conn=null,isHost=false,oppName="الخصم",myFinished=false,oppFinished=false,oppFinalScore=0;

function $(id){return document.getElementById(id)}
function show(id){["home","lobby","game","end"].forEach(x=>$(x).classList.add("hidden"));$(id).classList.remove("hidden")}
function roomPeerId(code){return "brainbattle-rs-"+code}
function setLobbyStatus(msg){let el=$("lobbyStatus");if(el)el.textContent=msg}

function createRoom(){
playerName=$("name").value.trim()||"Player 1";
room=Math.floor(100000+Math.random()*900000)+"";
isHost=true;
enterLobby();
setLobbyStatus("جارٍ إنشاء الغرفة…");
peer=new Peer(roomPeerId(room));
peer.on('open',()=>{setLobbyStatus("جاهز! انتظر انضمام اللاعب الثاني…")});
peer.on('connection',(c)=>{conn=c;setupConnHandlers()});
peer.on('error',(err)=>{
if(err.type==='unavailable-id'){setLobbyStatus("رمز الغرفة مستخدم حاليًا، اضغط خروج وجرب رمز/غرفة جديدة");}
else{setLobbyStatus("خطأ بالاتصال ("+err.type+")، تأكد من اتصالك بالإنترنت");}
});
}

function joinRoom(){
playerName=$("name").value.trim()||"Player 2";
room=$("roomInput").value.trim();
if(!room){alert("أدخل رمز الغرفة أولاً");return}
isHost=false;
enterLobby();
setLobbyStatus("جارٍ الاتصال بالغرفة "+room+"…");
peer=new Peer();
peer.on('open',()=>{conn=peer.connect(roomPeerId(room));setupConnHandlers()});
peer.on('error',(err)=>{setLobbyStatus("تعذر الاتصال، تأكد من رمز الغرفة والإنترنت")});
}

function setupConnHandlers(){
conn.on('open',()=>{
if(!isHost)conn.send({type:'hello',name:playerName});
});
conn.on('data',handleData);
conn.on('close',()=>{setLobbyStatus("انقطع الاتصال بالخصم");$("startBtn").disabled=true});
}

function handleData(msg){
if(msg.type==='hello'){
oppName=msg.name;$("p2").textContent=oppName;
let picked=shuffle(QUESTION_BANK).slice(0,Math.min(QUESTIONS_PER_GAME,QUESTION_BANK.length));
questions=picked.map(([q,opts,ans])=>{
let correctText=opts[ans];let newOpts=shuffle(opts);let newAns=newOpts.indexOf(correctText);
return [q,newOpts,newAns];
});
conn.send({type:'welcome',name:playerName,questions});
setLobbyStatus("اللاعب الثاني انضم! اضغط ابدأ المباراة");
$("startBtn").disabled=false;
}
else if(msg.type==='welcome'){
oppName=msg.name;$("p2").textContent=oppName;questions=msg.questions;
setLobbyStatus("تم الاتصال! بانتظار أن يبدأ صاحب الغرفة المباراة…");
}
else if(msg.type==='start'){beginGameLocal()}
else if(msg.type==='score'){oppScore=msg.total;$("gs2").textContent=oppScore}
else if(msg.type==='finished'){oppFinished=true;oppFinalScore=msg.total;maybeShowFinal()}
}

function enterLobby(){$("roomCode").textContent=room;$("p1").textContent=playerName;$("p2").textContent="في الانتظار…";show("lobby")}
function copyRoom(){navigator.clipboard?.writeText(room);alert("تم نسخ رمز الغرفة: "+room)}

function startGame(){
if(!conn||!conn.open){alert("لا يوجد اتصال باللاعب الثاني بعد");return}
conn.send({type:'start'});
beginGameLocal();
}

function exitGame(){
clearInterval(timer);
try{if(conn&&conn.open)conn.close()}catch(e){}
try{if(peer)peer.destroy()}catch(e){}
location.reload();
}
function beginGameLocal(){
idx=0;score=0;oppScore=0;myFinished=false;oppFinished=false;oppFinalScore=0;
$("gs1").textContent="0";$("gs2").textContent="0";
$("g1").textContent=playerName;$("g2").textContent=oppName;
show("game");render();
}

function render(){
let [q,opts,ans]=questions[idx];$("counter").textContent=`السؤال ${idx+1} / ${questions.length}`;$("question").textContent=q;$("status").textContent="";
let box=$("choices");box.innerHTML="";
opts.forEach((o,i)=>{let b=document.createElement("button");b.className="choice";b.textContent=o;b.onclick=()=>answer(i,ans,b);box.appendChild(b)});
time=TIME_PER_QUESTION;clearInterval(timer);$("bar").style.width="100%";timer=setInterval(()=>{time-=.1;$("bar").style.width=Math.max(0,time/TIME_PER_QUESTION*100)+"%";if(time<=0){clearInterval(timer);answer(-1,ans,null)}},100)
}
function answer(chosen,ans,btn){
clearInterval(timer);document.querySelectorAll(".choice").forEach(b=>b.disabled=true);
if(btn)btn.classList.add(chosen===ans?"correct":"wrong");
if(chosen===ans){let pts=Math.max(1,Math.ceil(time));score+=pts;$("gs1").textContent=score;$("status").textContent=`صحيح! +${pts} نقطة ⚡`}
else{$("status").textContent=chosen===-1?"انتهى الوقت ⏱️":"إجابة خاطئة";}
if(conn&&conn.open)conn.send({type:'score',total:score});
setTimeout(()=>{idx++;if(idx>=questions.length)finish();else render()},900)
}
function finish(){
myFinished=true;
if(conn&&conn.open)conn.send({type:'finished',total:score});
maybeShowFinal();
}
function maybeShowFinal(){
if(!myFinished)return;
show("end");
let maxScore=questions.length*TIME_PER_QUESTION;
let oppLine=oppFinished?`${oppName}: ${oppFinalScore} نقطة`:`${oppName}: لم ينهِ الجولة بعد…`;
let resultText;
if(oppFinished){
if(score>oppFinalScore)resultText="🏆 فزت!";
else if(score<oppFinalScore)resultText="😅 خسرت الجولة";
else resultText="🤝 تعادل!";
}else{resultText="🎯 أنهيت جولتك"}
$("winner").textContent=resultText;
$("finalScore").innerHTML=`نتيجتك: ${score} من ${maxScore}<br>${oppLine}`;
}
