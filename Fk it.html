function setLanguage(l){
    currentLang = l
    document.documentElement.lang = l;
    document.documentElement.dir = (l === 'ar') ? 'rtl' : 'ltr';
    document.getElementById('langToggleBtn').textContent = (l === 'ar') ? 'English' : 'العربية';
    updateStaticTexts();
}


function toggleLanguage() {
  setLanguage(currentLang === 'en' ? 'ar' : 'en');
}

  if(questions.length && $("counter")) $("counter").textContent = t.qCounter(idx+1, questions.length);
}
function shuffle(arr){let a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function bankForLang(l){return l === 'en' ? EN_QUESTION_BANK : AR_QUESTION_BANK;}
let questions=[];
const QUESTIONS_PER_GAME=20;
const TIME_PER_QUESTION=18;
let playerName="",room="",score=0,oppScore=0,idx=0,timer=null,time=TIME_PER_QUESTION;
let peer=null,conn=null,isHost=false,oppName="",myFinished=false,oppFinished=false,oppFinalScore=0;

function $(id){return document.getElementById(id)}
function show(id){["home","lobby","game","end"].forEach(x=>$(x).classList.add("hidden"));$(id).classList.remove("hidden")}
function roomPeerId(code){return "brainbattle-rs-"+code}
function setLobbyStatus(msg){let el=$("lobbyStatus");if(el)el.textContent=msg}

function createRoom(){
playerName=$("name").value.trim()||"Player 1";
room=Math.floor(100000+Math.random()*900000)+"";
isHost=true;
enterLobby();
setLobbyStatus(i18n[currentLang].creatingRoom);
peer=new Peer(roomPeerId(room));
peer.on('open',()=>{setLobbyStatus(i18n[currentLang].roomReady)});
peer.on('connection',(c)=>{conn=c;setupConnHandlers()});
peer.on('error',(err)=>{
if(err.type==='unavailable-id'){setLobbyStatus(i18n[currentLang].idTaken);}
else{setLobbyStatus(i18n[currentLang].connError+"("+err.type+")");}
});
}

function joinRoom(){
playerName=$("name").value.trim()||"Player 2";
room=$("roomInput").value.trim();
if(!room){alert(i18n[currentLang].enterRoomFirst);return}
isHost=false;
enterLobby();
setLobbyStatus(i18n[currentLang].connecting+room+"...");
peer=new Peer();
peer.on('open',()=>{conn=peer.connect(roomPeerId(room));setupConnHandlers()});
peer.on('error',(err)=>{setLobbyStatus(i18n[currentLang].joinFailed)});
}

function setupConnHandlers(){
conn.on('open',()=>{
if(!isHost)conn.send({type:'hello',name:playerName});
});
conn.on('data',handleData);
conn.on('close',()=>{setLobbyStatus(i18n[currentLang].disconnected);$("startBtn").disabled=true});
}

function handleData(msg){
if(msg.type==='hello'){
oppName=msg.name;$("p2").textContent=oppName;
const bank = bankForLang(currentLang);
let picked=shuffle(bank).slice(0,Math.min(QUESTIONS_PER_GAME,bank.length));
questions=picked.map(([q,opts,ans])=>{
let correctText=opts[ans];let newOpts=shuffle(opts);let newAns=newOpts.indexOf(correctText);
return [q,newOpts,newAns];
});
conn.send({type:'welcome',name:playerName,questions,lang:currentLang});
setLobbyStatus(i18n[currentLang].oppJoined);
$("startBtn").disabled=false;
}
else if(msg.type==='welcome'){
oppName=msg.name;$("p2").textContent=oppName;questions=msg.questions;
setLobbyStatus(i18n[currentLang].waitingHost);
}
else if(msg.type==='start'){beginGameLocal()}
else if(msg.type==='score'){oppScore=msg.total;$("gs2").textContent=oppScore}
else if(msg.type==='finished'){oppFinished=true;oppFinalScore=msg.total;maybeShowFinal()}
}

function enterLobby(){$("roomCode").textContent=room;$("p1").textContent=playerName;$("p2").textContent=i18n[currentLang].waitingOpp;show("lobby")}
function copyRoom(){navigator.clipboard?.writeText(room);alert(i18n[currentLang].copied+room)}

function startGame(){
if(!conn||!conn.open){alert(i18n[currentLang].noConn);return}
conn.send({type:'start'});
beginGameLocal();
}

function exitGame(){
clearInterval(timer);
try{if(conn&&conn.open)conn.close()}catch(e){}
try{if(peer)peer.destroy()}catch(e){}
location.reload();
}
function beginGameLocal(){
idx=0;score=0;oppScore=0;myFinished=false;oppFinished=false;oppFinalScore=0;
$("gs1").textContent="0";$("gs2").textContent="0";
$("g1").textContent=playerName;$("g2").textContent=oppName;
$("langToggleBtn").classList.add("hidden");
show("game");render();
}

function render(){
let [q,opts,ans]=questions[idx];$("counter").textContent=i18n[currentLang].qCounter(idx+1, questions.length);$("question").textContent=q;$("status").textContent="";
let box=$("choices");box.innerHTML="";
opts.forEach((o,i)=>{let b=document.createElement("button");b.className="choice";b.textContent=o;b.onclick=()=>answer(i,ans,b);box.appendChild(b)});
time=TIME_PER_QUESTION;clearInterval(timer);$("bar").style.width="100%";timer=setInterval(()=>{time-=.1;$("bar").style.width=Math.max(0,time/TIME_PER_QUESTION*100)+"%";if(time<=0){clearInterval(timer);answer(-1,ans,null)}},100)
}
function answer(chosen,ans,btn){
clearInterval(timer);document.querySelectorAll(".choice").forEach(b=>b.disabled=true);
if(btn)btn.classList.add(chosen===ans?"correct":"wrong");
if(chosen===ans){let pts=Math.max(1,Math.ceil(time));score+=pts;$("gs1").textContent=score;$("status").textContent=i18n[currentLang].correct(pts)}
else{$("status").textContent=chosen===-1?i18n[currentLang].timeUp:i18n[currentLang].wrong;}
if(conn&&conn.open)conn.send({type:'score',total:score});
setTimeout(()=>{idx++;if(idx>=questions.length)finish();else render()},900)
}
function finish(){
myFinished=true;
if(conn&&conn.open)conn.send({type:'finished',total:score});
maybeShowFinal();
}
function maybeShowFinal(){
if(!myFinished)return;
show("end");
let maxScore=questions.length*TIME_PER_QUESTION;
let oppLine=oppFinished?i18n[currentLang].oppScoreLine(oppName, oppFinalScore):i18n[currentLang].oppNotDone(oppName);
let resultText;
if(oppFinished){
if(score>oppFinalScore)resultText=i18n[currentLang].won;
else if(score<oppFinalScore)resultText=i18n[currentLang].lost;
else resultText=i18n[currentLang].tie;
}else{resultText=i18n[currentLang].doneSolo}
$("winner").textContent=resultText;
$("finalScore").innerHTML="${i18n[currentLang].yourScore(score,maxScore)}<br>${oppLine}";
}
</script></body></html>
